http:
  routers:
    authelia-router:
      rule: "Host(`auth.gusbus.co.za`)"
      service: authelia-service
      entryPoints:
        - web

    hello-router:
      rule: "Host(`gusbus.co.za`)"
      service: hello-service
      entryPoints:
        - web
      middlewares:
        - authelia-guard

  services:
    authelia-service:
      loadBalancer:
        servers:
          - url: "http://authelia:9091"

    hello-service:
      loadBalancer:
        servers:
          - url: "http://hello-world:80"

  middlewares:
    authelia-guard:
      forwardAuth:
        # We add the explicit target query parameter to tell Authelia where the root auth portal lives
        address: "http://authelia:9091/api/authz/forward-auth?authelia_url=https%3A%2F%2Fauth.gusbus.co.za%2F"
        trustForwardHeader: true
        authResponseHeaders:
          - "Remote-User"
          - "Remote-Groups"
          - "Remote-Name"
          - "Remote-Email"
